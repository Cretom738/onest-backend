version: "3.8"

volumes:
  onest-db-volume:
  onest-redis-volume:

services:
  onest-db:
    image: postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - onest-db-volume:/var/lib/postgresql/data
    ports: 
      - ${POSTGRES_PORT:-5434}:5432
  redis:
    image: redis:latest
    restart: always
    command: --requirepass ${REDIS_PASSWORD} --user ${REDIS_USERNAME} on >${REDIS_PASSWORD} --user default off
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - onest-redis-volume:/data
  

  